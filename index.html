<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lars Simulator</title>
<style>
:root{--yellow:#ffe14d;--red:#c4160a;--ink:#111;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050403;color:#ddd;
  font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
h1{margin:6px 0 0;font-family:Arial,Helvetica,sans-serif;font-weight:700;
  letter-spacing:.16em;font-size:clamp(20px,4vw,30px);color:#e7e7e7;text-shadow:none;transform:none}
#wrap{width:min(100%,960px);aspect-ratio:16/9;background:#000;border:4px solid #000;
  box-shadow:0 0 0 2px #3a1a14,8px 8px 0 #300}
#wrap:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;box-shadow:none}
canvas{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;cursor:pointer}
.btn{font:inherit;font-weight:700;color:var(--ink);background:var(--yellow);border:3px solid #000;
  box-shadow:3px 3px 0 #000;padding:8px 14px;border-radius:4px;cursor:pointer}
.btn:hover{background:#fff}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
#hint{max-width:680px;margin:0;text-align:center;font-size:14px;line-height:1.5;opacity:.75}
</style>
</head>
<body>
<h1>LARS SIMULATOR</h1>
<div id="wrap"><canvas id="game" aria-label="Lars Simulator"></canvas></div>
<button class="btn" id="fsBtn" type="button">Fullscreen</button>
<p id="hint">WASD move · mouse look · Shift sprint · hold C crouch · Space jump · hold RMB to focus · Q blink · E interact · T torch · [ ] FOV. Secret: type ssadad, then click or press X to fire.</p>

<script>
/* =========================================================
   LARS SIMULATOR
   Tiny raycaster + a nextbot. One file, no libraries.
   Sections: setup > Lars frames > sound > map > Lars AI > update > render > input > loop
   ========================================================= */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const RW = 320, RH = 180;                  // tiny resolution on purpose (cheap look + fast)
cv.width = RW; cv.height = RH;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
document.getElementById('fsBtn').onclick = () => {
  const w = document.getElementById('wrap');
  if (document.fullscreenElement) document.exitFullscreen(); else if (w.requestFullscreen) w.requestFullscreen();
};

  if (slowT > 0) { slowT -= dt; ts = .2 + .8 * Math.pow(1 - Math.max(0, slowT) / .7, 2); } else ts = 1;
  update(dt * ts); draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
